
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Avenzo</title>

    <link rel="stylesheet" href="../Css-file/style.css">
    <link rel="stylesheet" href="../Css-file/LOGIN.CSS">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js-script/auth.js" defer></script>
    <script src="../js-script/script.js" defer></script>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="top-block">
        <div class="nav-content">

            <div class="navigation-element-photos">
                <img src="../images-png/LogoNew.png"
                     alt="Logo"
                     class="logo"
                     draggable="false">
            </div>

            <div class="element-top">
                <div class="dropdown1">
                    <p class="dropdown-home">Products</p>
                </div>

                <div class="dropdown2">
                    <p class="font-support">Support</p>
                </div>

                <div class="dropdown3">
                    <p class="font-about-avenzo">About Avenzo</p>
                </div>

                <div class="dropdown4">
                    <p class="font-contact">Sign up</p>
                </div>
            </div>

        </div>
    </nav>


    <!-- LOGIN PAGE -->
    <section class="login-page">

        <h1 class="login-heading">
            Sign in to Avenzo.
        </h1>

        <div class="login-columns">

            <!-- SIGN IN -->
            <div class="login-col">

                <h2>Sign in with your Avenzo Account</h2>

                <form class="signin-form" onsubmit="return false;">

                    <div class="input-wrap">
                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Email"
                            required>
                    </div>

                    <div class="input-wrap password-wrap">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Password"
                            required>

                        <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Show password">
                            <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>

                        <button
                            type="submit"
                            class="arrow-btn"
                            aria-label="Sign in">
                            →
                        </button>

                    </div>

                </form>

                <label class="remember-me">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <p class="login-hint" id="loginHint"
                   aria-live="polite"></p>

                <p class="toggle-signup">
                    Don't have an Avenzo Account?
                    <a href="#" id="showSignup">
                        Create one here
                    </a>
                </p>


                <!-- CREATE ACCOUNT -->
                <form
                    class="signup-form"
                    id="signupForm"
                    style="display:none;"
                    onsubmit="return false;">

                    <h2>Create an Avenzo Account</h2>

                    <div class="input-wrap">
                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Email"
                            required>
                    </div>

                    <div class="input-wrap password-wrap">
                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Password (min 6 characters)"
                            required
                            minlength="6">

                        <button type="button" class="toggle-password" data-target="signupPassword" aria-label="Show password">
                            <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>

                    <button
                        type="submit"
                        class="guest-btn"
                        id="signupBtn">
                        Create Account
                    </button>

                    <p class="signup-hint"
                       id="signupHint"
                       aria-live="polite"></p>

                </form>

            </div>


            <!-- DIVIDER -->
            <div class="col-divider"></div>


            <!-- GUEST CHECKOUT -->
            <div class="login-col guest-column">

                <h2>Guest Checkout</h2>

                <p class="guest-text">
                    Continue without an account.
                    You can create an Avenzo Account later.
                </p>

                <a href="ECOM.HTML" class="guest-btn">
                    Continue as Guest
                </a>

                <p class="guest-hint"
                   id="guestHint"
                   aria-live="polite"></p>

            </div>

        </div>

    </section>

</body>
</html>
